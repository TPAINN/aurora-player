<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Aurora Player — Artwork-led music PWA with word-by-word synced lyrics and beat-reactive visuals.">
<title>Aurora Player</title>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06141a"/><stop offset="1" stop-color="#0c0a1f"/></linearGradient>
<linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#a78bfa"/></linearGradient>
<linearGradient id="tt" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#5eead4"/></linearGradient>
<radialGradient id="orb"><stop offset="0" stop-color="#5eead4" stop-opacity=".55"/><stop offset="1" stop-color="#5eead4" stop-opacity="0"/></radialGradient>
<radialGradient id="orb2"><stop offset="0" stop-color="#a78bfa" stop-opacity=".45"/><stop offset="1" stop-color="#a78bfa" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
<clipPath id="clip"><rect width="1280" height="360" rx="22"/></clipPath>
<style>
.bar{transform-box:fill-box;transform-origin:center bottom;animation:eq 1.4s ease-in-out infinite}
@keyframes eq{0%,100%{transform:scaleY(.35)}50%{transform:scaleY(1)}}
.pulse{transform-box:fill-box;transform-origin:center;animation:pl 2.6s ease-in-out infinite}
@keyframes pl{0%,100%{transform:scale(1);opacity:.85}50%{transform:scale(1.3);opacity:1}}
.ring{transform-box:fill-box;transform-origin:center;animation:rg 4s ease-out infinite}
@keyframes rg{0%{transform:scale(.75);opacity:.6}100%{transform:scale(1.15);opacity:0}}
.float{animation:fl 6s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.glow{filter:drop-shadow(0 0 8px #5eead4)}
.blink{animation:bk 1.1s steps(2,start) infinite}
@keyframes bk{to{opacity:0}}
.sweep{animation:sw 3.4s ease-in-out infinite}
@keyframes sw{0%,100%{transform:translateY(0)}50%{transform:translateY(272px)}}
.cell{animation:ce 3.2s ease-in-out infinite}
@keyframes ce{0%,100%{opacity:.25}50%{opacity:1}}
.scramble{animation:sc 3s ease-in-out infinite}
@keyframes sc{0%,100%{opacity:.15}30%,70%{opacity:1}}
.seg{transform-box:fill-box;transform-origin:left;animation:sg 3s ease-in-out infinite}
@keyframes sg{0%,100%{transform:scaleX(.2);opacity:.4}50%{transform:scaleX(1);opacity:1}}
.flip{transform-box:fill-box;transform-origin:center;animation:fp 5s ease-in-out infinite}
@keyframes fp{0%,40%,100%{transform:scaleX(1)}50%{transform:scaleX(.05)}60%,90%{transform:scaleX(1)}}
.ringbell{transform-box:fill-box;transform-origin:50% 8%;animation:rb 2.4s ease-in-out infinite}
@keyframes rb{0%,100%{transform:rotate(0)}15%{transform:rotate(9deg)}30%{transform:rotate(-9deg)}45%{transform:rotate(5deg)}60%{transform:rotate(0)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</defs>
<g clip-path="url(#clip)">
<rect width="1280" height="360" fill="url(#bg)"/>
<rect width="1280" height="360" fill="url(#grid)"/>
<circle cx="260" cy="40" r="260" fill="url(#orb)"><animate attributeName="cx" values="260;340;260" dur="14s" repeatCount="indefinite"/></circle>
<circle cx="1080" cy="340" r="300" fill="url(#orb2)"><animate attributeName="cy" values="340;290;340" dur="11s" repeatCount="indefinite"/></circle>
<circle class="ring" cx="1010" cy="170" r="150" fill="none" stroke="url(#g1)" stroke-width="1.5"/><circle class="ring" style="animation-delay:-2s" cx="1010" cy="170" r="110" fill="none" stroke="url(#g1)" stroke-width="1.5"/><rect x="820" y="90" width="300" height="14" rx="7" fill="#fff" opacity="0.12"/><rect x="820" y="120" width="380" height="14" rx="7" fill="#5eead4" opacity="0.95" class="glow"/><rect x="820" y="150" width="260" height="14" rx="7" fill="#fff" opacity="0.12"/><rect class="bar" x="800" y="260" width="8" height="40" rx="4" fill="url(#g1)" style="animation-delay:-0.00s;animation-duration:1.10s"/><rect class="bar" x="814" y="207" width="8" height="93" rx="4" fill="url(#g1)" style="animation-delay:-0.52s;animation-duration:1.28s"/><rect class="bar" x="828" y="154" width="8" height="146" rx="4" fill="url(#g1)" style="animation-delay:-1.04s;animation-duration:1.46s"/><rect class="bar" x="842" y="251" width="8" height="49" rx="4" fill="url(#g1)" style="animation-delay:-0.15s;animation-duration:1.64s"/><rect class="bar" x="856" y="198" width="8" height="102" rx="4" fill="url(#g1)" style="animation-delay:-0.67s;animation-duration:1.82s"/><rect class="bar" x="870" y="145" width="8" height="155" rx="4" fill="url(#g1)" style="animation-delay:-1.19s;animation-duration:1.10s"/><rect class="bar" x="884" y="242" width="8" height="58" rx="4" fill="url(#g1)" style="animation-delay:-0.31s;animation-duration:1.28s"/><rect class="bar" x="898" y="189" width="8" height="111" rx="4" fill="url(#g1)" style="animation-delay:-0.83s;animation-duration:1.46s"/><rect class="bar" x="912" y="136" width="8" height="164" rx="4" fill="url(#g1)" style="animation-delay:-1.34s;animation-duration:1.64s"/><rect class="bar" x="926" y="233" width="8" height="67" rx="4" fill="url(#g1)" style="animation-delay:-0.46s;animation-duration:1.82s"/><rect class="bar" x="940" y="180" width="8" height="120" rx="4" fill="url(#g1)" style="animation-delay:-0.98s;animation-duration:1.10s"/><rect class="bar" x="954" y="127" width="8" height="173" rx="4" fill="url(#g1)" style="animation-delay:-0.10s;animation-duration:1.28s"/><rect class="bar" x="968" y="224" width="8" height="76" rx="4" fill="url(#g1)" style="animation-delay:-0.62s;animation-duration:1.46s"/><rect class="bar" x="982" y="171" width="8" height="129" rx="4" fill="url(#g1)" style="animation-delay:-1.13s;animation-duration:1.64s"/><rect class="bar" x="996" y="118" width="8" height="182" rx="4" fill="url(#g1)" style="animation-delay:-0.25s;animation-duration:1.82s"/><rect class="bar" x="1010" y="215" width="8" height="85" rx="4" fill="url(#g1)" style="animation-delay:-0.77s;animation-duration:1.10s"/><rect class="bar" x="1024" y="162" width="8" height="138" rx="4" fill="url(#g1)" style="animation-delay:-1.29s;animation-duration:1.28s"/><rect class="bar" x="1038" y="259" width="8" height="41" rx="4" fill="url(#g1)" style="animation-delay:-0.41s;animation-duration:1.46s"/><rect class="bar" x="1052" y="206" width="8" height="94" rx="4" fill="url(#g1)" style="animation-delay:-0.92s;animation-duration:1.64s"/><rect class="bar" x="1066" y="153" width="8" height="147" rx="4" fill="url(#g1)" style="animation-delay:-0.04s;animation-duration:1.82s"/><rect class="bar" x="1080" y="250" width="8" height="50" rx="4" fill="url(#g1)" style="animation-delay:-0.56s;animation-duration:1.10s"/><rect class="bar" x="1094" y="197" width="8" height="103" rx="4" fill="url(#g1)" style="animation-delay:-1.08s;animation-duration:1.28s"/><rect class="bar" x="1108" y="144" width="8" height="156" rx="4" fill="url(#g1)" style="animation-delay:-0.20s;animation-duration:1.46s"/><rect class="bar" x="1122" y="241" width="8" height="59" rx="4" fill="url(#g1)" style="animation-delay:-0.71s;animation-duration:1.64s"/><rect class="bar" x="1136" y="188" width="8" height="112" rx="4" fill="url(#g1)" style="animation-delay:-1.23s;animation-duration:1.82s"/><rect class="bar" x="1150" y="135" width="8" height="165" rx="4" fill="url(#g1)" style="animation-delay:-0.35s;animation-duration:1.10s"/><rect class="bar" x="1164" y="232" width="8" height="68" rx="4" fill="url(#g1)" style="animation-delay:-0.87s;animation-duration:1.28s"/><rect class="bar" x="1178" y="179" width="8" height="121" rx="4" fill="url(#g1)" style="animation-delay:-1.39s;animation-duration:1.46s"/><rect class="bar" x="1192" y="126" width="8" height="174" rx="4" fill="url(#g1)" style="animation-delay:-0.50s;animation-duration:1.64s"/><rect class="bar" x="1206" y="223" width="8" height="77" rx="4" fill="url(#g1)" style="animation-delay:-1.02s;animation-duration:1.82s"/>
<text x="72" y="140" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="84" font-weight="800" letter-spacing="-2" fill="url(#tt)">Aurora Player</text>
<text x="72" y="200" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">Artwork-led music PWA with word-by-word synced</text><text x="72" y="232" font-family="Inter,'Segoe UI','SF Pro Display','Helvetica Neue',Arial,sans-serif" font-size="22" fill="#fff" fill-opacity=".72">lyrics and beat-reactive visuals.</text>
