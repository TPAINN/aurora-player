<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- Prevents white flash on load -->
    <meta name="theme-color" content="#151717" />
    <meta name="description" content="Your music, closer. Listen with immersive artwork, synchronized lyrics and a library that stays yours. No account needed." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />

    <!-- Discover the app font alongside the stylesheet. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Warm the connections the first cover and the first song will need. -->
    <link rel="preconnect" href="https://www.youtube.com" />
    <link rel="preconnect" href="https://i.ytimg.com" />
    <link rel="preconnect" href="https://is1-ssl.mzstatic.com" />
    <link rel="dns-prefetch" href="https://e-cdns-images.dzcdn.net" />
    <link rel="dns-prefetch" href="https://cdn-images.dzcdn.net" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;650;700;750;800&display=swap" />

    <!-- iOS full-screen feel -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Versioned so browsers drop any icon cached from earlier deployments. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=2" />
    <link rel="icon" href="/favicon.ico?v=2" sizes="any" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Aurora" />
    <meta name="apple-mobile-web-app-title" content="Aurora" />
    <title>Aurora</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
